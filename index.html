<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII-Converter</title>
<style>
:root{--bg:#e7e8ea;--ink:#17181a;--panel:#f5f5f6;--line:#c8cacf;--acc:#2f4bff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#131415;--ink:#ecedee;--panel:#1c1e20;--line:#34373b;--acc:#93a2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:grid;grid-template-columns:310px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
label{display:flex;flex-direction:column;gap:5px;font-size:13px}
label.row{flex-direction:row;align-items:center;gap:8px}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=color]{padding:2px;height:34px;width:100%}
input[type=checkbox]{accent-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer}
button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:20px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}
pre{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.2;white-space:pre;padding:18px;border-radius:4px;border:1px solid var(--line)}
@media(max-width:760px){body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>ASCII-Converter</h1>
  <label>Bild einfügen (PNG, JPG)<input id="file" type="file" accept="image/*"></label>
  <label>Markenname<input id="name" value="STUDIO"></label>
  <label>Motiv
    <select id="mode">
      <option value="bild">Bild (PNG/JPG)</option>
      <option value="schrift">Schriftzug</option>
      <option value="muster" selected>Muster (organisch)</option>
      <option value="wellen">Wellen</option>
      <option value="ringe">Ringe</option>
      <option value="karo">Karo / Gewebe</option>
    </select>
  </label>
  <label>Zeichensatz
    <select id="ramp">
      <option value=" .:-=+*#%@">Klassisch</option>
      <option value=" ·.:oO0@">Punkte</option>
      <option value=" ░▒▓█">Blöcke</option>
      <option value=" -=≡#">Linien</option>
      <option value=" ·+xX#">Kreuze</option>
    </select>
  </label>
  <div class="two">
    <label>Format
      <select id="fmt"><option value=".5">Quadrat</option><option value=".35">Quer</option><option value=".75">Hoch (Shirt)</option></select>
    </label>
    <label>Breite<input id="cols" type="range" min="40" max="160" value="90"></label>
  </div>
  <label>Kontrast<input id="ct" type="range" min="5" max="30" value="12"></label>
  <label>Mustergröße<input id="scale" type="range" min="1" max="20" value="8"></label>
  <div class="two">
    <label>Seed<input id="seed" type="number" value="7"></label>
    <label>&nbsp;<button id="dice" class="main">Neu würfeln</button></label>
  </div>
  <label class="row"><input id="mask" type="checkbox"> Muster nur im Schriftzug</label>
  <label class="row"><input id="inv" type="checkbox"> Zeichen umkehren</label>
  <div class="two">
    <label>Farbe<input id="ink" type="color" value="#17181a"></label>
    <label>Hintergrund<input id="bg" type="color" value="#f1efe9"></label>
  </div>
  <label class="row"><input id="tr" type="checkbox"> Export mit transparentem Hintergrund</label>
  <div class="two">
    <button id="bPng">PNG</button><button id="bSvg">SVG</button>
    <button id="bTxt">Text kopieren</button><button id="bFile">.txt</button>
  </div>
</aside>
<main><pre id="out" aria-label="Vorschau des Motivs"></pre></main>

<script>
const $=id=>document.getElementById(id);
let lines=[],cols=0,rows=0;

// Zufall & Rauschen
const H=(x,y,s)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1274126177);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
const sm=t=>t*t*(3-2*t);
function vn(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=sm(x-ix),fy=sm(y-iy);
  const a=H(ix,iy,s),b=H(ix+1,iy,s),c=H(ix,iy+1,s),d=H(ix+1,iy+1,s);
  const t=a+(b-a)*fx,u=c+(d-c)*fx;return t+(u-t)*fy}
const fbm=(x,y,s)=>(vn(x,y,s)*.55+vn(x*2,y*2,s+1)*.3+vn(x*4,y*4,s+2)*.15);
const clamp=v=>Math.max(0,Math.min(1,v));

// Bild laden und auf das Zeichenraster verkleinern
let img=null;
function imageData(){
  const c=document.createElement('canvas');c.width=cols;c.height=rows;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high';x.drawImage(img,0,0,cols,rows);
  return x.getImageData(0,0,cols,rows).data;
}
function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const i=new Image();
  i.onload=()=>{img=i;$('mode').value='bild';render()};
  i.src=URL.createObjectURL(f);
}
$('file').onchange=e=>loadFile(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});
addEventListener('paste',e=>loadFile([...e.clipboardData.files][0]));

// Schriftzug als Raster (Zellen sind etwa doppelt so hoch wie breit)
function textCoverage(){
  const c=document.createElement('canvas');c.width=cols;c.height=rows;
  const x=c.getContext('2d',{willReadFrequently:true});
  const t=($('name').value||' ').toUpperCase();
  const f=s=>`900 ${s}px "Arial Black",Impact,Arial,sans-serif`;
  x.font=f(100);const w=x.measureText(t).width||1;
  const fs=Math.min(100*cols*.9/w,rows*2*.8);
  x.font=f(fs);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';
  x.setTransform(1,0,0,.5,0,0);x.fillText(t,cols/2,rows);
  const d=x.getImageData(0,0,cols,rows).data,cov=new Float32Array(cols*rows);
  for(let i=0;i<cov.length;i++)cov[i]=d[i*4+3]/255;
  return cov;
}

function render(){
  cols=+$('cols').value;rows=Math.max(12,Math.round(cols*+$('fmt').value));
  const o=$('out');
  if($('mode').value==='bild'){
    if(!img){lines=[];o.textContent='Bild auswählen, hierher ziehen\noder mit Strg+V einfügen.';o.style.color=$('ink').value;o.style.background=$('bg').value;o.style.fontSize='16px';return}
    rows=Math.max(8,Math.round(cols*img.naturalHeight/img.naturalWidth*.5));
  }
  const seed=+$('seed').value|0,fr=.01*+$('scale').value,ph=(Math.abs(seed)%628)/100;
  const mode=$('mode').value,mask=$('mask').checked||mode==='schrift';
  let ramp=[...$('ramp').value];if($('inv').checked)ramp.reverse();
  const cov=mask?textCoverage():null,n=ramp.length,ct=+$('ct').value/10,im=mode==='bild'?imageData():null;
  lines=[];
  for(let y=0;y<rows;y++){
    let s='';
    for(let x=0;x<cols;x++){
      const px=x,py=y*2,m=cov?cov[y*cols+x]:1;
      if(mode!=='schrift'&&m<.4){s+=' ';continue}
      let v;
      if(mode==='schrift')v=m;
      else if(mode==='bild'){const k=(y*cols+x)*4;if(im[k+3]<25){s+=' ';continue}v=clamp((1-(.2126*im[k]+.7152*im[k+1]+.0722*im[k+2])/255-.5)*ct+.5)}
      else if(mode==='muster')v=clamp((fbm(px*fr,py*fr,seed)-.25)/.5);
      else if(mode==='wellen')v=.5+.5*Math.sin(py*fr*3+fbm(px*fr*.6,py*fr*.6,seed)*7+ph);
      else if(mode==='ringe')v=.5+.5*Math.sin(Math.hypot(px-cols/2,py-rows)*fr*3+fbm(px*fr,py*fr,seed)*3+ph);
      else v=.5+.5*Math.sin(px*fr*3+fbm(px*fr,py*fr,seed)*3)*Math.sin(py*fr*3+ph);
      s+=ramp[Math.min(n-1,Math.floor(v*n))];
    }
    lines.push(s.replace(/\s+$/,''));
  }
  o.textContent=lines.join('\n');
  o.style.color=$('ink').value;o.style.background=$('bg').value;
  const avail=Math.max(260,o.parentElement.clientWidth-40-36);
  o.style.fontSize=Math.max(3,Math.min(16,avail/(cols*.6)))+'px';
}

// Export
const save=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('bPng').onclick=()=>{
  const px=40,c=document.createElement('canvas'),g=c.getContext('2d');
  g.font=px+'px monospace';const w=g.measureText('M').width,h=px*1.2;
  c.width=Math.ceil(w*cols);c.height=Math.ceil(h*rows);
  g.font=px+'px monospace';g.textBaseline='middle';
  if(!$('tr').checked){g.fillStyle=$('bg').value;g.fillRect(0,0,c.width,c.height)}
  g.fillStyle=$('ink').value;
  lines.forEach((l,i)=>[...l].forEach((ch,j)=>{if(ch!==' ')g.fillText(ch,j*w,i*h+h/2)}));
  c.toBlob(b=>save(b,'motiv.png'));
};
$('bSvg').onclick=()=>{
  const px=20,w=px*.6,h=px*1.2,esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${cols*w} ${rows*h}" width="${cols*w}" height="${rows*h}">`;
  if(!$('tr').checked)s+=`<rect width="100%" height="100%" fill="${$('bg').value}"/>`;
  s+=`<g font-family="Menlo,Consolas,monospace" font-size="${px}" fill="${$('ink').value}" xml:space="preserve" style="white-space:pre">`;
  lines.forEach((l,i)=>{if(l.trim())s+=`<text x="0" y="${(i+.8)*h}" textLength="${l.length*w}" lengthAdjust="spacing">${esc(l)}</text>`});
  save(new Blob([s+'</g></svg>'],{type:'image/svg+xml'}),'motiv.svg');
};
$('bTxt').onclick=async e=>{try{await navigator.clipboard.writeText(lines.join('\n'));e.target.textContent='Kopiert'}catch{e.target.textContent='Nicht möglich'}setTimeout(()=>e.target.textContent='Text kopieren',1500)};
$('bFile').onclick=()=>save(new Blob([lines.join('\n')],{type:'text/plain'}),'motiv.txt');
$('dice').onclick=()=>{$('seed').value=Math.floor(Math.random()*9999);render()};

document.querySelectorAll('aside input,aside select').forEach(el=>el.addEventListener('input',render));
addEventListener('resize',render);
render();
</script>
</body>
</html>
